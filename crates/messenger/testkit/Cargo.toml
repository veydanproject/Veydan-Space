[package]
name = "messenger-testkit"
description = "Test doubles for messenger crates: in-memory SecretStore, FakeTransport, fixtures"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
messenger-core.workspace = true
messenger-store.workspace = true
messenger-runtime.workspace = true
messenger-notify.workspace = true
messenger-dm.workspace = true
messenger-groups.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "signal", "io-std", "io-util"] }
zeroize.workspace = true
nostr.workspace = true

[[bin]]
name = "messenger-cli"
path = "src/bin/messenger-cli.rs"

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
