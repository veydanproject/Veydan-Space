[package]
name = "messenger-ingress"
description = "Messenger ingress: validate, dedup and classify wire events into Inbound; dispatch to handlers; persistent outbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
messenger-core.workspace = true
messenger-store.workspace = true
messenger-identity.workspace = true
nostr.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
messenger-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
