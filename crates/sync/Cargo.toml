[package]
name = "veydan-sync"
version = "0.1.0"
description = "E2E-encrypted sync core over dumb file storage (folder / S3 / WebDAV)"
authors = ["Veydan Project"]
edition = "2021"
license-file = "../../LICENSE"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
chacha20poly1305 = "0.10"
argon2 = "0.6.0-rc.8"
rand = { version = "0.10", features = ["thread_rng"] }
zstd = "0.13"
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
reqwest = "0.13"
tokio = { version = "1", default-features = false, features = ["time", "rt", "io-util", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
quick-xml = "0.39"
url = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Free-space query for download staging.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

# reqwest's default verifier needs a Java component on Android; use bundled roots instead.
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
webpki-roots = "1"
