[package]
name = "messenger-http"
description = "One way to build an HTTPS client: bundled roots, fixed crypto provider, the same on every platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
messenger-core.workspace = true
messenger-vlink.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }

[dev-dependencies]
messenger-vlink = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true
http.workspace = true
