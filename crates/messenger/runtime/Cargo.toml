[package]
name = "messenger-runtime"
description = "Assembles the messenger graph (store, transport, ingress, handlers) into one object a host embeds"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
messenger-core.workspace = true
messenger-store.workspace = true
messenger-identity.workspace = true
messenger-transport.workspace = true
messenger-vlink.workspace = true
messenger-ingress.workspace = true
messenger-contacts.workspace = true
messenger-dm.workspace = true
messenger-media.workspace = true
messenger-groups.workspace = true
messenger-links.workspace = true
messenger-preview.workspace = true
messenger-push.workspace = true
messenger-notify.workspace = true
messenger-http.workspace = true
messenger-presence.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
async-trait.workspace = true
nostr.workspace = true
serde.workspace = true
ts-rs.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "fs"] }
serde_json.workspace = true
base64.workspace = true

[dev-dependencies]
messenger-testkit.workspace = true
wiremock.workspace = true
tempfile.workspace = true
sqlx.workspace = true
nostr-sdk = { workspace = true, features = ["local-relay"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
