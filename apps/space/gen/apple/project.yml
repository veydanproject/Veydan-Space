name: veydanspace
options:
  bundleIdPrefix: net.veydan.mobile
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Veydan
      PRODUCT_BUNDLE_IDENTIFIER: net.veydan.mobile
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  veydanspace_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # The archives of Rust land here at build time (libapp.a, the share
      # extension's libveydan_share_ext.a) and are linked by the search
      # paths: a file found here when xcodegen runs must not become a
      # resource of the app (rc.4 of 5.2.3: the simulator's debug archives
      # of this Mac, missing on the runner, failed the build).
      - path: Externals
        excludes: ["**/*"]
      - path: veydanspace_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: veydanspace_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Standard algorithms only, not sold in France: App Store Connect needs
        # no documentation (its answer of 2026-11-19); true wants a documentation
        # code and the upload is refused without one (90592).
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: 5.2.3
        CFBundleVersion: "5.2.3"
    entitlements:
      path: veydanspace_iOS/veydanspace_iOS.entitlements
      properties:
        aps-environment: development
        # The data lives in the container of this group, for the share extension (crates/shell/src/ios_group.rs).
        com.apple.security.application-groups: [group.net.veydan.mobile]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS[sdk=iphoneos*]: $(inherited) -force_load $(SRCROOT)/../../../../data/toolchains/webrtc/webrtc-89d790b/ios-device-arm64-release/lib/libwebrtc-objc.a
        OTHER_LDFLAGS[sdk=iphonesimulator*]: $(inherited) -force_load $(SRCROOT)/../../../../data/toolchains/webrtc/webrtc-89d790b/ios-simulator-arm64-release/lib/libwebrtc-objc.a
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      # «Поделиться» into Veydan from another app: the share extension, embedded in the app (PlugIns/).
      - target: veydanspace_share
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CallKit.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CryptoKit.framework
      - sdk: Foundation.framework
      - sdk: GLKit.framework
      - sdk: ImageIO.framework
      - sdk: Network.framework
      - sdk: OpenGLES.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: PushKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: UserNotifications.framework
      - sdk: VideoToolbox.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: $SRCROOT/../../../../ui/node_modules/.bin/tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # The share extension («Поделиться» into Veydan from another app,
  # internal/messenger-wire.md §5): a process of its own that opens the
  # app's data in the container of the app group and sends by itself. Its
  # Rust (crates/share-ext, without the engine of calls) is built by the
  # phase below into Externals/share/<platform>/<configuration>/ and linked
  # as an archive; the Swift of ShareExtension/ is the screen.
  veydanspace_share:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Veydan
        CFBundleShortVersionString: 5.2.3
        CFBundleVersion: "5.2.3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareNavigationController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 50
              NSExtensionActivationSupportsFileWithMaxCount: 50
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.net.veydan.mobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.veydan.mobile.share
        PRODUCT_NAME: VeydanShare
        PRODUCT_MODULE_NAME: VeydanShare
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: ShareExtension/Bridging.h
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../../../../crates/share-ext/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/Externals/share/$(PLATFORM_NAME)/$(CONFIGURATION)
        OTHER_LDFLAGS: $(inherited) -lveydan_share_ext
        ENABLE_BITCODE: false
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        APPLICATION_EXTENSION_API_ONLY: true
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - script: PATH=/opt/homebrew/bin:$PATH bash $SRCROOT/../../../../scripts/ios/share-ext.sh space ${PLATFORM_NAME:?} ${CONFIGURATION:?} $SRCROOT/Externals/share/${PLATFORM_NAME:?}/${CONFIGURATION:?}
        name: Build Share Extension Rust
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/share/$(PLATFORM_NAME)/$(CONFIGURATION)/libveydan_share_ext.a
    # App Store Connect takes an extension only with the version and the
    # build number of its app. The tauri CLI writes those into the app's
    # Info.plist alone (the version of the product, the build number of the
    # run: release.yml): copied from there into the extension's processed
    # Info.plist before it is signed. The numbers above are what a build
    # without the CLI shows.
    postCompileScripts:
      - script: |
          app="$SRCROOT/veydanspace_iOS/Info.plist"
          ext="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          v="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app")"
          b="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app")"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $v" -c "Set :CFBundleVersion $b" "$ext"
          echo "share extension: version $v, build $b (the app's)"
        name: Take the App Version
        basedOnDependencyAnalysis: false