[package]
name = "messenger-evidence"
description = "Evidence of a report: proofs that a key wrote a message, built by the client and checked by a server without any user key"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

# The server of the project builds this crate too: nothing here may pull
# the store, the network or an application framework.
[dependencies]
nostr.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
chacha20.workspace = true
base64.workspace = true
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The wraps and the group messages of the tests are made by the code that
# makes them in the app, so a change there that breaks a proof breaks here.
messenger-core.workspace = true
messenger-dm.workspace = true
messenger-groups.workspace = true
