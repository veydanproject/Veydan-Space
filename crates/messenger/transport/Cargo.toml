[package]
name = "messenger-transport"
description = "Messenger network side: relay pool over nostr-sdk implementing core::Transport, and the signed infrastructure manifest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
messenger-core.workspace = true
messenger-http.workspace = true
messenger-vlink.workspace = true
reqwest.workspace = true
nostr.workspace = true
nostr-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-util = { workspace = true, features = ["sink"] }
rustls.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
# The websocket of a relay over a stream that came from a bridge (ws.rs).
# The same versions nostr-sdk brings.
async-wsocket.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
messenger-vlink = { workspace = true, features = ["testing"] }
nostr-sdk = { workspace = true, features = ["local-relay"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
