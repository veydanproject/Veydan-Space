#
# Every cargo workspace under this folder builds into one target directory,
# data/target (relative to the folder that holds .cargo/): the root workspace,
# crates/messenger and, in the monorepo, services/link, services/hub and
# services/push. Their lock files differ; cargo keeps the artefacts of each
# apart by hash. CARGO_TARGET_DIR still wins: the Android wrappers set
# data/target-android/<product> (internal/platform-spec.md 4.1, 13.4).
[build]
target-dir = "data/target"

# The Windows archive of libwebrtc (livekit/rust-sdks) is built against the
# static C runtime (/MT). Everything linked into one binary with it has to use
# the same runtime, or the linker refuses (LNK2038 RuntimeLibrary mismatch),
# so the whole Windows build of every product is static-CRT; cc compiles the
# C++ of webrtc-sys with /MT when it sees this feature.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# The Android WebView of every product (wry's generated `RustWebView`) tells a
# keyboard that its fields take pictures, so Gboard's clipboard, stickers and
# GIFs reach the chat (crates/shell/android, `KeyboardContent`). wry splices
# this into the class when it writes its Kotlin files; any other build of wry
# reads nothing of it.
[env]
# The prebuilt libwebrtc of the engine of calls, as scripts/webrtc-toolchain.sh
# unpacks it (the vendored webrtc-sys reads VEYDAN_WEBRTC_DIR): named here for
# the build of iOS, whose cargo runs inside Xcode and gets from the Tauri CLI
# the CARGO_*, RUST_* and TAURI_* variables alone. A variable already set (the
# scripts, the workflows) wins over this line.
VEYDAN_WEBRTC_DIR = { value = "data/toolchains/webrtc", relative = true }
WRY_RUSTWEBVIEW_CLASS_EXTENSION = "override fun onCreateInputConnection(outAttrs: android.view.inputmethod.EditorInfo): android.view.inputmethod.InputConnection? = net.veydan.shell.KeyboardContent.connect(this, outAttrs, super.onCreateInputConnection(outAttrs))"
