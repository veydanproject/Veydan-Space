name: CI

# Veydan Space. This repository is a snapshot of the sources of one product,
# published release by release; nobody commits here by hand. The workflow
# proves that the snapshot builds by itself from a clean clone: the crate of
# the product, its UI, the type check and the tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      # The UI project is ui/: its package.json and lock file are there.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: node scripts/ui.mjs space svelte-check

      - name: Unit tests (vitest)
        run: node scripts/ui.mjs space vitest run

      - name: Build the UI
        run: node scripts/ui.mjs space build

  # Which crate may depend on which, where Tauri may appear, what a UI file
  # may import. Reads the manifests through `cargo metadata`; nothing is
  # compiled or downloaded.
  boundaries:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # The version and the components rust-toolchain.toml names.
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc -V
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Boundaries
        run: bash scripts/boundaries.sh

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # The tauri crate does not compile without the WebKitGTK headers,
      # test builds included.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential \
            dbus \
            curl wget file

      # The version and the components rust-toolchain.toml names.
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc -V

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> data/target
          key: ci

      # The engine of calls (crates/messenger/rtc), which the product links
      # through the messenger: the prebuilt libwebrtc, fetched once by
      # scripts/webrtc-toolchain.sh, pinned by sha256 and kept between runs
      # by its tag. Its C++ bridge (the vendored webrtc-sys) needs clang 21
      # for the hermetic libc++ of libwebrtc, which jammy has not:
      # apt.llvm.org.
      - name: libwebrtc (cache)
        uses: actions/cache@v6
        with:
          path: data/toolchains/webrtc
          key: webrtc-veydan-v1.0.10-linux-x64
      - name: libwebrtc and clang 21
        run: |
          bash scripts/webrtc-toolchain.sh linux-x64
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          echo "VEYDAN_WEBRTC_DIR=$PWD/data/toolchains/webrtc" >> "$GITHUB_ENV"
          echo "VEYDAN_WEBRTC_CLANGXX=/usr/bin/clang++-21" >> "$GITHUB_ENV"

      # The product by itself first: a build of the whole workspace unifies
      # the features of its dependencies and can hide a crate that does not
      # compile alone.
      - name: Check (veydanspace)
        run: cargo check -p veydanspace --locked

      - name: Tests (workspace)
        run: cargo test --workspace --all-targets --locked

  # The crates of the messenger are a workspace of their own, free of Tauri,
  # with their own lock file.
  messenger:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # The version and the components rust-toolchain.toml names.
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc -V
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/messenger -> ../../data/target
          key: messenger
      # The engine of calls, as in the job rust; and the glib headers the
      # build script of its C++ bridge asks pkg-config for (the job rust
      # has them with WebKitGTK).
      - name: libwebrtc (cache)
        uses: actions/cache@v6
        with:
          path: data/toolchains/webrtc
          key: webrtc-veydan-v1.0.10-linux-x64
      - name: libwebrtc and clang 21
        run: |
          bash scripts/webrtc-toolchain.sh linux-x64
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y libglib2.0-dev
          echo "VEYDAN_WEBRTC_DIR=$PWD/data/toolchains/webrtc" >> "$GITHUB_ENV"
          echo "VEYDAN_WEBRTC_CLANGXX=/usr/bin/clang++-21" >> "$GITHUB_ENV"
      - name: Tests (messenger workspace)
        run: cargo test --workspace --all-targets --locked --manifest-path crates/messenger/Cargo.toml
