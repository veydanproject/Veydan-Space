[package]
name = "veydan-cloud"
description = "The module Cloud: the client of Veydan Cloud — the account, its plan and limits, the storage of the vault and the recovery of an account"
version = "0.1.0"
edition = "2021"
authors = ["Veydan Project"]
license-file = "../../LICENSE"
publish = false

[build-dependencies]
veydan-build-cfg = { path = "../build-cfg" }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The module contract and the seams: the messenger's Signer, PeerNotes,
# BotCards and Http come through the shell, never through its crate; the
# box `cloud` of the lock too.
veydan-shell = { path = "../shell" }
# The storage of the vault the module hands out (CloudApi::storage).
veydan-sync = { path = "../sync" }
# The data file the hosts of the backend `cloud` are kept in (src/sync.rs).
veydan-core = { path = "../core" }
# The proof of work of the activation and of a request of recovery.
veydan-recovery = { path = "../recovery" }
# The work of the proof in a thread of its own, the daily refresh, the state
# of an activation under way.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# The tag `payload` of NIP-98 and the id of an event signed by T.
sha2 = "0.11"
base64 = "0.22"
# NIP-98 by the temporary key T of a procedure of recovery (cloud-api.md 2.3).
secp256k1 = "0.30"
getrandom = "0.3"
zeroize = "1"
# The lock and the escrow (cloud-recovery.md §3, §4, §7): the Recovery Key
# wrap of the vault key, `recover_keep`, the key of the vault for the escrow;
# the binding of the device to the vault and the key row the vault holds
# (`adopt_vault_key`) for the restore in the order of §7.
veydan-lock = { path = "../lock" }
veydan-sync-host = { path = "../sync-host" }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }

# ── Mobile only: the camera reads the QR code of a new device ────────────────
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[dev-dependencies]
# Mock runtime: the command answers without the app.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# The fake of /cloud/v1 the client is tested against, on loopback.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.13", default-features = false }
# The data file of the tests of the backend `cloud`.
tempfile = "3"
