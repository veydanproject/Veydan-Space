[package]
name = "tauri-plugin-veydan-media"
description = "The phone's gallery for the sheet of the paperclip: access, pages of photos and videos, thumbnails, the system camera and Photo Picker, HEIC written as JPEG"
version = "0.1.0"
edition = "2021"
authors = ["Veydan Project"]
license-file = "../../LICENSE"
publish = false
build = "build.rs"
# tauri-build finds the Android library of a plugin through this name; on
# iOS tauri-plugin links the Swift package (ios/) under the crate's name.
links = "tauri-plugin-veydan-media"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
thiserror = "2"

# The bundle's own identifier (src/lib.rs `ios_cache_dir`): the same
# Objective-C bindings tauri and wry use on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
# The manifest of the test executables on Windows.
veydan-build-cfg = { path = "../build-cfg" }
