[package]
name = "tauri-plugin-veydan-push"
description = "Bridge between the app and the phone's push service: token, permission, notifications"
version = "0.1.0"
edition = "2021"
authors = ["Veydan Project"]
license-file = "../../LICENSE"
publish = false
build = "build.rs"
# tauri-build finds the Android library of a plugin through this name.
links = "tauri-plugin-veydan-push"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
thiserror = "2"
base64 = "0.22"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
# The manifest of the test executables on Windows.
veydan-build-cfg = { path = "../build-cfg" }
