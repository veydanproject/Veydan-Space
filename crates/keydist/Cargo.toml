[package]
name = "keydist"
description = "Key distribution for large encrypted scopes: broadcast revocation (Complete Subtree, Subset Difference) with epoch keys, member bundles and static shards; the scheme and its state, no I/O"
version = "0.1.0"
edition = "2021"
authors = ["Veydan Project"]
license-file = "../../LICENSE"
publish = false

# A pure crate of the platform (internal/platform-spec.md 6.1,
# internal/communities-keydist.md): no crate of the repository, no Tauri,
# no network, no database. The messenger, the other modules, a keeper
# service of a community owner and the simulator take the same code.
[dependencies]
sha2 = "0.11"
hkdf = "0.13"
hmac = "0.13"
aes-gcm = "0.11"
# The system random source: epoch keys, generation masters, nonces.
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
hex = "0.4"
thiserror = "2"
# The benchmark only: the price of the NIP-44 envelope a bundle travels in
# (the same crate and features the messenger uses).
nostr = { version = "0.45", default-features = false, features = ["std", "nip44", "os-rng"], optional = true }

[features]
# The simulator and the benchmark binaries (phase 1), nothing of the library.
tools = ["serde_json", "nostr"]

[[bin]]
name = "keydist-sim"
path = "src/bin/sim.rs"
required-features = ["tools"]

[[bin]]
name = "keydist-bench"
path = "src/bin/bench.rs"
required-features = ["tools"]

[dev-dependencies]
serde_json = "1"
