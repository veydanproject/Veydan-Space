[package]
name = "messenger-notify"
description = "What a push is about, worked out on the phone: the event opened with the user's keys, the names and settings read from the messenger's database"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
messenger-core.workspace = true
messenger-store.workspace = true
messenger-ingress.workspace = true
messenger-contacts.workspace = true
messenger-dm.workspace = true
messenger-groups.workspace = true
messenger-transport.workspace = true
messenger-vlink.workspace = true
nostr.workspace = true
nostr-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
zeroize = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
sqlx.workspace = true
messenger-testkit.workspace = true
messenger-media.workspace = true
# Only to keep the life of an invitation the same as the core's.
messenger-calls.workspace = true
