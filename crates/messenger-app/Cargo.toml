[package]
name = "veydan-messenger-app"
description = "The adapter of the messenger: its commands, the start of its runtime, its secrets in the box of the lock, push on Android and notifications on a computer"
version = "0.1.0"
edition = "2021"
authors = ["Veydan Project"]
license-file = "../../LICENSE"
publish = false

[build-dependencies]
veydan-build-cfg = { path = "../build-cfg" }

[dependencies]
# Open http(s) links (and, on a computer, received files) without going through a shell
tauri-plugin-opener = "2"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util", "fs"] }
async-trait = "0.1.89"
base64 = "0.22"
# Wipes the messenger's secrets from memory
zeroize = "1"
# The calls log of a computer (commands/calls_log.rs): the lines of the
# engine and the core of calls come through the `log` bridge of tracing
# (no subscriber of tracing is installed in a product), those of libwebrtc
# through the sink of its crate.
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
# A file saved to a content:// URI on Android goes through the fs plugin.
tauri-plugin-fs = "2"
# The process holds two rustls crypto providers (aws-lc-rs from the host
# tree, ring from nostr-sdk) and rustls refuses to guess; the setup of the
# module installs aws-lc-rs explicitly.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# Errors, settings, the data directory.
veydan-core = { path = "../core" }
# The module contract and the services of the host: the product, the unread
# count, the main window, picked files, the camera and the microphone.
veydan-shell = { path = "../shell" }
# The box `messenger` the secrets are kept in, and the events of the lock.
veydan-lock = { path = "../lock" }
# The messenger: a workspace of its own, free of Tauri (internal/messenger-spec.md).
messenger-core = { path = "../messenger/core" }
messenger-runtime = { path = "../messenger/runtime" }
# A picked photo of HEIC made a JPEG (`common`), with the phone's decoder.
messenger-media = { path = "../messenger/media" }
# The choices of chats (pin, mute, archive) another module reads back for its
# rows of the list of chats (src/net_lend.rs).
messenger-store = { path = "../messenger/store" }
messenger-notify = { path = "../messenger/notify" }
# The seam Http of the module cloud (src/cloud_seams.rs): the messenger's HTTPS
# client and its way through a bridge, to the hosts of the project.
messenger-http = { path = "../messenger/http" }
# The seams of the module cloud (src/cloud_seams.rs): NIP-98 and NIP-44 with
# the keys the identity service loads; the version of the messenger's workspace.
nostr = { version = "0.45", default-features = false, features = ["std", "nip44", "os-rng"] }
# derive_secret of the seam Signer: HKDF of the nsec for one purpose
# (cloud-recovery.md §3), on every platform.
hkdf = "0.13"
sha2 = "0.11"

# ── Desktop only: the notifications of the system, links and files opened ────
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
# Notifications of the messenger on a computer (D-Bus, WinRT, UserNotifications).
desktop-notify = { path = "../desktop-notify" }
# The sender's picture of a notification, as a file named by its content.
sha2 = "0.11"
# The window icon of the product as a file, for systems that take the
# source's icon from one (Windows).
png = "0.18"
# The clipboard of a computer: a picture (a screenshot) or files copied in a
# file manager, pasted into a chat where the webview hands over nothing
# (WebKitGTK, WKWebView).
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }

# ── Android: push, the push handler's way in without the app, calls ──────────
[target.'cfg(target_os = "android")'.dependencies]
# The product depends on the plugin too: tauri-build finds the plugin's
# Android library through the direct dependencies of the product crate.
tauri-plugin-veydan-push = { path = "../tauri-plugin-veydan-push" }
# The phone's side of a call: the ringing notification, its service, the sound.
tauri-plugin-veydan-call = { path = "../tauri-plugin-veydan-call" }
# The phone's gallery in the sheet of the paperclip, its camera and Photo Picker, its decoder of HEIC.
tauri-plugin-veydan-media = { path = "../tauri-plugin-veydan-media" }
jni = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
# The body a NIP-98 event of the seams is signed for, as a server hashes it.
sha2 = "0.11"
# The relay of the test that stops and starts the messenger: a socket that
# takes the handshake and keeps the connection, as a relay does.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = "0.3"
