name: Release
run-name: ${{ contains(github.ref_name, '-rc.') && 'RC' || 'Release' }} ${{ github.ref_name }}

# Every bundle of ONE product, built and published in the product's own
# public repository on GitHub (docs/ci-cd.md, "Releases"). This file lives
# in the monorepo and reaches the repository of each product with its
# snapshot (products.json, publish.shared); nothing ever runs it in the
# monorepo.
#
#   make push <product> rc|release   (the owner, in the monorepo), or the
#   merge of a pull request labelled rc:<product> (rc-on-merge of
#   veydanproject/release on Gitea)
#     → the release workflow of Gitea (veydanproject/release) publishes the
#       snapshot of the tagged commit here under vX.Y.Z-rc.N or vX.Y.Z; THIS
#       workflow builds Windows, macOS (two architectures) and Linux in a
#       matrix, Android (the APK, and the app bundle for Google Play) in a
#       job of its own, iOS (the .ipa) in another for a product with an
#       Xcode project, checks every updater signature, writes latest.json
#       and SHA256SUMS, and publishes the release — an rc as a pre-release
#       (the updater never offers it), a release as the latest.
#   make push <product> dev
#     → a dev build, on Gitea alone: nothing comes here.
#
# The build jobs only build and sign; the release is written with the run's
# own token by the job `publish`, the only one with `contents: write`. The
# app bundle for Google Play is an artifact of the run (90 days), never a
# file of the release: the owner uploads it to the Play Console by hand.
on:
  push:
    tags: ['v*']
  # Again, by hand, on a release tag.
  workflow_dispatch:

# Read-only for every job; `publish` alone asks for more.
permissions:
  contents: read

# One run per tag at a time; a second one waits, it does not cancel a
# release half built.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      product: ${{ steps.meta.outputs.product }}
      version: ${{ steps.meta.outputs.version }}
      kind: ${{ steps.meta.outputs.kind }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      notes_file: ${{ steps.meta.outputs.notes_file }}
      product_name: ${{ steps.meta.outputs.product_name }}
      asset_prefix: ${{ steps.meta.outputs.asset_prefix }}
      messenger: ${{ steps.meta.outputs.messenger }}
      lib_name: ${{ steps.meta.outputs.lib_name }}
      matrix: ${{ steps.meta.outputs.matrix }}
      updater_keys: ${{ steps.meta.outputs.updater_keys }}
      updater_pubkey: ${{ steps.meta.outputs.updater_pubkey }}
      build_desktop: ${{ steps.meta.outputs.build_desktop }}
      build_android: ${{ steps.meta.outputs.build_android }}
      build_ios: ${{ steps.meta.outputs.build_ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The product, the version (it must equal VERSION at the tagged
      # commit), the platforms and the names of the files.
      - id: meta
        name: Parse the tag and verify VERSION
        run: bash scripts/release/meta.sh

  # The desktop bundles of the product (Windows, macOS, Linux), signed for
  # the updater, as artifacts of the run. No token: this job publishes nothing.
  build:
    needs: meta
    if: needs.meta.outputs.build_desktop == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    env:
      PRODUCT: ${{ needs.meta.outputs.product }}
      # The archive of libwebrtc for the target of this job, by the names of
      # scripts/webrtc-toolchain.sh: macOS builds both architectures on one
      # runner, and each needs its own.
      WEBRTC_TARGET: ${{ matrix.artifact == 'linux-x86_64' && 'linux-x64' || matrix.artifact == 'windows-x86_64' && 'win-x64' || matrix.artifact == 'darwin-aarch64' && 'mac-arm64' || 'mac-x64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release build of a product, with three Linux bundles, on a runner
      # whose disk the image mostly fills with toolchains this job never uses.
      - name: Free disk space
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # The version rust-toolchain.toml names; macOS is built once per
      # architecture.
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          case "${{ matrix.platform }}" in macos*) rustup target add aarch64-apple-darwin x86_64-apple-darwin ;; esac
          rustc -V

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> data/target
          key: ${{ matrix.platform }}${{ matrix.args }}

      # The engine of calls (crates/messenger/rtc), which a product with the
      # messenger links: the prebuilt libwebrtc of the target, fetched once by
      # scripts/webrtc-toolchain.sh, pinned by sha256 and kept between runs
      # by its tag (the key moves with WEBRTC_TAG of the script). The build
      # script of the vendored webrtc-sys refuses to build without it
      # (vendor/webrtc-sys/PATCH.md, patch 2). A product without the
      # messenger links no engine: these steps are skipped for it, and it
      # downloads nothing. On Linux the C++ bridge needs clang 21 for the
      # hermetic libc++ of libwebrtc, which jammy has not: apt.llvm.org with
      # its key kept in the repository (scripts/ci/clang.sh). On Windows and
      # macOS the system's compiler (MSVC, Xcode) builds it. VEYDAN_WEBRTC_DIR
      # is the workspace as the runner names it (D:\a\… on Windows): the $PWD
      # of Git Bash there is /d/a/…, which cargo, run from pwsh, would read
      # as a folder of the current drive.
      - name: libwebrtc (cache)
        if: needs.meta.outputs.messenger == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/toolchains/webrtc
          key: webrtc-veydan-v1.0.10-${{ env.WEBRTC_TARGET }}
      - name: libwebrtc
        if: needs.meta.outputs.messenger == 'true'
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          bash scripts/webrtc-toolchain.sh "$WEBRTC_TARGET"
          echo "VEYDAN_WEBRTC_DIR=$WORKSPACE/data/toolchains/webrtc" >> "$GITHUB_ENV"
      - name: clang 21 (Linux)
        if: needs.meta.outputs.messenger == 'true' && startsWith(matrix.platform, 'ubuntu')
        run: |
          bash scripts/ci/clang.sh 21
          echo "VEYDAN_WEBRTC_CLANGXX=/usr/bin/clang++-21" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # The updater installs only signed bundles; a build without the key
      # would produce none and no signature.
      - name: The updater key is there
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The secret TAURI_SIGNING_PRIVATE_KEY is required: the updater installs only signed bundles"
            exit 1
          fi

      # macOS: the Developer ID of Rookbeam Technologies LLC signs the app
      # and Apple notarizes it, so Gatekeeper opens it without a warning.
      # The secrets of the organization decide the path, and only the answer
      # leaves the step: all six, a bundle signed and notarized; none, a
      # bundle signed ad hoc as before (Gatekeeper warns), said in the
      # summary of the run; some of them, a mistake that stops the job. The
      # key of App Store Connect is the one of the iOS job (the role Admin
      # notarizes too). Only a release is signed so: an rc is signed ad hoc
      # whatever the secrets, since the notary service makes each macOS row
      # wait (the owner's decision of 2026-11-19); the rc is for us, the
      # release is what people download.
      - id: apple
        name: The Apple secrets (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          KIND: ${{ needs.meta.outputs.kind }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IOS_API_ISSUER: ${{ secrets.IOS_API_ISSUER }}
          IOS_API_KEY_ID: ${{ secrets.IOS_API_KEY_ID }}
          IOS_API_KEY_P8: ${{ secrets.IOS_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ "$KIND" != "release" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS of an $KIND is signed ad hoc: only a release is signed with the Developer ID and notarized"
            {
              echo "### macOS is not notarized"
              echo
              echo "An $KIND is signed ad hoc: only a release is signed with the Developer ID and notarized. Gatekeeper warns on the first start."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set_count=0
          for value in "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY" \
            "$IOS_API_ISSUER" "$IOS_API_KEY_ID" "$IOS_API_KEY_P8"; do
            [ -z "$value" ] || set_count=$((set_count + 1))
          done
          case "$set_count" in
            6) echo "signed=true" >> "$GITHUB_OUTPUT" ;;
            0)
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::macOS is signed ad hoc and not notarized: the Apple secrets are not set for this repository"
              {
                echo "### macOS is not notarized"
                echo
                echo "The app is signed ad hoc: the Apple secrets are not set for this repository (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, IOS_API_ISSUER, IOS_API_KEY_ID, IOS_API_KEY_P8)."
                echo "Gatekeeper warns on the first start."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::APPLE_CERTIFICATE (base64 of the .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, IOS_API_ISSUER, IOS_API_KEY_ID and IOS_API_KEY_P8 (base64 of the .p8) are set together or not at all; $set_count of 6 are set"
              exit 1
              ;;
          esac

      # The CLI is the one of the UI project (ui/): TAURI_APP_PATH names the
      # product and TAURI_FRONTEND_PATH the UI project (13.2) — the CLI never
      # searches — and the product's beforeBuildCommand builds its UI there
      # through the launcher (node ../scripts/ui.mjs <product> build).
      # CARGO_TARGET_DIR is where .cargo/config.toml puts cargo's output.
      # The runner's own shell: the line reads the same in each. Windows,
      # Linux and a macOS without the Apple secrets.
      - name: Build and sign the bundles
        if: steps.apple.outputs.signed != 'true'
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/apps/${{ needs.meta.outputs.product }}
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/ui
          CARGO_TARGET_DIR: ${{ github.workspace }}/data/target
          # Signs updater artifacts (.sig) so installed apps accept them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir ui tauri build ${{ matrix.args }}

      # The same build on macOS with the Developer ID: the variables the
      # Tauri CLI reads, each from its secret in the env of this step alone.
      # APPLE_CERTIFICATE goes into a keychain of the run; APPLE_SIGNING_IDENTITY
      # takes the place of the "-" (ad hoc) of tauri.conf.json; the app and
      # the .dmg are signed with the hardened runtime and the product's
      # Entitlements.plist; the updater's .app.tar.gz is made of that app.
      # Tauri does not notarize: it is given no key of App Store Connect
      # (NOTARY_*, not APPLE_API_*), since its `notarytool --wait` holds one
      # connection for as long as Apple takes and gives up on the first
      # blink of the network (rc.10 of Space 5.2.2: the first submission
      # of the Developer ID was still "In Progress" after 2.5 hours, the
      # runner lost its route for a moment, the job died). The .dmg alone
      # goes to the notary service, which notarizes the app inside it too
      # (a ticket for each signed thing of the submission, published by
      # Apple, which Gatekeeper finds online), and the step asks for the
      # answer once a minute, a failed question asked again, for up to four
      # and a half hours; then the ticket is stapled to the .dmg, so a
      # downloaded .dmg opens without a warning even offline. The key is a
      # file of the run removed by the trap whatever happens.
      - name: Build, sign with the Developer ID and notarize (macOS)
        if: steps.apple.outputs.signed == 'true'
        shell: bash
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/apps/${{ needs.meta.outputs.product }}
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/ui
          CARGO_TARGET_DIR: ${{ github.workspace }}/data/target
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ISSUER: ${{ secrets.IOS_API_ISSUER }}
          NOTARY_KEY_ID: ${{ secrets.IOS_API_KEY_ID }}
          IOS_API_KEY_P8: ${{ secrets.IOS_API_KEY_P8 }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/notary"
          trap 'rm -rf "$keys"' EXIT
          mkdir -p "$keys"
          printf '%s' "$IOS_API_KEY_P8" | base64 -d > "$keys/AuthKey_$NOTARY_KEY_ID.p8"
          unset IOS_API_KEY_P8
          notary() { xcrun notarytool "$@" --key "$keys/AuthKey_$NOTARY_KEY_ID.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"; }
          pnpm --dir ui tauri build ${{ matrix.args }}
          dmgs=$(ls "data/target/$TARGET/release/bundle/dmg/"*.dmg)
          [ "$(printf '%s\n' "$dmgs" | wc -l)" -eq 1 ] || { echo "::error::one .dmg expected: $dmgs"; exit 1; }
          id=""
          for attempt in 1 2 3 4 5; do
            if answer=$(notary submit "$dmgs" --output-format json); then
              id=$(printf '%s' "$answer" | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p')
              [ -n "$id" ] && break
            fi
            echo "the .dmg did not reach the notary service (attempt $attempt): ${answer:-no answer}"
            sleep 30
          done
          [ -n "$id" ] || { echo "::error::the .dmg did not reach Apple's notary service"; exit 1; }
          echo "submitted to the notary service: $id"
          deadline=$((SECONDS + 270 * 60))
          status=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            if info=$(notary info "$id" --output-format json 2>&1); then
              status=$(printf '%s' "$info" | sed -n 's/.*"status" *: *"\([^"]*\)".*/\1/p')
              case "$status" in
                Accepted) break ;;
                Invalid|Rejected)
                  notary log "$id" || true
                  echo "::error::Apple's notary service answered $status for $dmgs"
                  exit 1
                  ;;
              esac
            else
              echo "the question to the notary service failed, asked again in a minute: $info"
            fi
            sleep 60
          done
          [ "$status" = "Accepted" ] || { echo "::error::no answer of the notary service for $id within 270 minutes (last: ${status:-none})"; exit 1; }
          echo "notarized after $((SECONDS / 60)) minutes of the step"
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple -v "$dmgs" && break
            [ "$attempt" -lt 5 ] || { echo "::error::the ticket was not stapled to $dmgs"; exit 1; }
            sleep 30
          done

      # What Gatekeeper will say on a Mac where the app is downloaded: the
      # signature holds, the authority is the Developer ID, the hardened
      # runtime is on, the ticket is stapled to the .dmg, and the assessment
      # names a notarized Developer ID for the .dmg and for the app in it
      # (whose ticket Gatekeeper fetches from Apple). A bundle that would
      # warn fails the run here, not on a user's Mac.
      - name: Gatekeeper accepts the app and the .dmg (macOS)
        if: steps.apple.outputs.signed == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP=$(ls -d "data/target/$TARGET/release/bundle/macos/"*.app | head -n 1)
          DMG=$(ls "data/target/$TARGET/release/bundle/dmg/"*.dmg | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          details=$(codesign -dvv "$APP" 2>&1)
          printf '%s\n' "$details" | grep -qF "Authority=$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::$APP is not signed with the Developer ID of the secrets"; exit 1; }
          printf '%s\n' "$details" | grep -qE 'flags=.*runtime' \
            || { echo "::error::$APP is signed without the hardened runtime"; exit 1; }
          # Each output is read whole before grep: grep -q leaving a pipe
          # early would fail the writer under pipefail.
          if [ -f "apps/$PRODUCT/Entitlements.plist" ]; then
            entitlements=$(codesign -d --entitlements - "$APP" 2>/dev/null)
            printf '%s\n' "$entitlements" | grep -q 'com.apple.security.device.audio-input' \
              || { echo "::error::$APP is signed without apps/$PRODUCT/Entitlements.plist"; exit 1; }
          fi
          xcrun stapler validate "$DMG"
          app_answer=$(spctl --assess --type execute -vv "$APP" 2>&1)
          echo "$app_answer"
          dmg_answer=$(spctl --assess --type open --context context:primary-signature -vv "$DMG" 2>&1)
          echo "$dmg_answer"
          printf '%s\n' "$app_answer" | grep -q 'source=Notarized Developer ID' \
            || { echo "::error::Gatekeeper does not take $APP as a notarized Developer ID"; exit 1; }
          printf '%s\n' "$dmg_answer" | grep -q 'source=Notarized Developer ID' \
            || { echo "::error::Gatekeeper does not take $DMG as a notarized Developer ID"; exit 1; }

      # The Objective-C categories of libwebrtc reach the binary only with
      # -ObjC, which the product's build.rs asks for
      # (veydan_build_cfg::darwin_webrtc_objc); without them the app dies
      # before `main` on `+[NSString stringForStdString:]` (ROO-869). The
      # category of that method, NSString (StdString), is looked for in the
      # binary of the bundle; the symbols are stripped, the metadata of
      # Objective-C stays.
      - name: libwebrtc categories in the binary (macOS)
        if: needs.meta.outputs.messenger == 'true' && startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          APP=$(ls -d "data/target/$TARGET/release/bundle/macos/"*.app | head -n 1)
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Contents/Info.plist")"
          if ! otool -ov "$BIN" | grep -E '\bname\b.*\bStdString$'; then
            echo "::error::$BIN has no category NSString (StdString) of libwebrtc: -ObjC did not reach the linker"
            exit 1
          fi

      # The installers and signatures of this product and version, named
      # for the release (Veydan.Notes_5.0.0_amd64.AppImage). Every signature
      # is checked against the public key of tauri.conf.json: a secret that
      # holds another key fails here, not on the first update.
      - name: Gather the bundles
        shell: bash
        env:
          PRODUCT_NAME: ${{ needs.meta.outputs.product_name }}
          VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          PUBKEY: ${{ needs.meta.outputs.updater_pubkey }}
        run: |
          BUNDLE="data/target/release/bundle"
          if [ -n "$TARGET" ]; then BUNDLE="data/target/$TARGET/release/bundle"; fi
          node scripts/release/assets.mjs collect --bundle "$BUNDLE" \
            --name "$PRODUCT_NAME" --version "$VERSION" --target "$TARGET" --pubkey "$PUBKEY" --out release-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.artifact }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 3

      # What the build took of the disk: the first runs record it.
      - name: Disk (after the job)
        if: always()
        shell: bash
        run: df -h . && du -sh data/target 2>/dev/null || true

  # The APK of the product, signed with the release key, and the app bundle
  # for Google Play, signed with the upload key. The JDK, the SDK and the NDK
  # are the pins of scripts/android/android-env.sh, installed into
  # data/toolchains (kept between runs by the cache), never the ones of the
  # runner's image: the same build as on our runner. No token: this job
  # publishes nothing.
  android:
    needs: meta
    if: needs.meta.outputs.build_android == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      PRODUCT: ${{ needs.meta.outputs.product }}
      VEYDAN_ANDROID_NO_ADB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchains of the image are not used: the pinned ones are.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # Rust, Node, pnpm, the JDK, the SDK and the NDK, as the scripts
      # install them; the key moves with the pins.
      - name: Toolchains (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/toolchains/rustup
            data/toolchains/cargo
            data/toolchains/node
            data/toolchains/jdk
            data/toolchains/android-sdk
            data/toolchains/gradle
          key: android-toolchains-${{ hashFiles('scripts/toolchain.sh', 'scripts/android/android-env.sh', 'rust-toolchain.toml', 'ui/.node-version', 'ui/package.json') }}
      # android-env.sh fetches the engine's archive for every product (a
      # product without the messenger links it not; the archive is small).
      - name: libwebrtc (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/toolchains/webrtc
          key: webrtc-veydan-v1.0.10-android-arm64
      # cargo's output of the last run of this product: the crates of the
      # registry are compiled once, the product every time.
      - name: cargo target (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/target-android/${{ needs.meta.outputs.product }}
          key: android-target-${{ needs.meta.outputs.product }}-${{ hashFiles('Cargo.lock', 'crates/messenger/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: android-target-${{ needs.meta.outputs.product }}-
      - name: Toolchains (scripts/android/android-env.sh)
        run: |
          set -euo pipefail
          source scripts/android/android-env.sh
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "$ROOT_DIR/data/toolchains/node/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
      # The version rust-toolchain.toml names (android-env.sh installed it
      # into data/toolchains with the Android targets; said here as every
      # job that runs cargo says it).
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc -V

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # Firebase settings for the messenger's pushes (products with the
      # messenger): one google-services.json with a client per product.
      - name: Write google-services.json
        if: needs.meta.outputs.messenger == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret (base64 of google-services.json) is required"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > "apps/$PRODUCT/gen/android/app/google-services.json"

      # The APK and the app bundle of the one architecture of the phones
      # (aarch64; the engine of calls is pinned for it alone), unsigned:
      # the keys are applied by the steps below, each from its secret.
      - name: Build Android (APK and app bundle)
        run: |
          set -euo pipefail
          # The NDK of the image is gone (Free disk space); its variables must not point a build script there.
          unset ANDROID_NDK_ROOT ANDROID_NDK ANDROID_NDK_LATEST_HOME ANDROID_NDK_HOME
          ROOT_DIR="$PWD"
          source scripts/android/android-env.sh
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.daemon=false"
          source scripts/product.sh
          product_env "$PRODUCT"
          export CARGO_TARGET_DIR="$(realpath data)/target-android/$PRODUCT"
          tauri_cli_ready
          "$TAURI_CLI" android build --target aarch64

      # The push handler of the messenger is called by name from Java
      # (scripts/release/android.sh symbol).
      - name: The JNI symbol of the push handler
        if: needs.meta.outputs.messenger == 'true'
        env:
          LIB_NAME: ${{ needs.meta.outputs.lib_name }}
        run: |
          NDK_LLVM_BIN="$(ls -d data/toolchains/android-sdk/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin | head -n1)"
          export NDK_LLVM_BIN
          bash scripts/release/android.sh symbol

      # The release key from the secrets, for one step (scripts/release/android.sh
      # sign; the alias is its default, veydan — not a secret: a secret whose
      # value is a word masks that word in every output, "veydanproject" included).
      - name: Sign the APK
        env:
          ASSET_PREFIX: ${{ needs.meta.outputs.asset_prefix }}
          VERSION: ${{ needs.meta.outputs.version }}
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_KS_PASS: ${{ secrets.ANDROID_RELEASE_KS_PASS }}
        run: |
          export JAVA_HOME="$PWD/data/toolchains/jdk"
          export PATH="$JAVA_HOME/bin:$PATH"
          APKSIGNER="$(ls -1 data/toolchains/android-sdk/build-tools/*/apksigner | tail -n1)"
          export APKSIGNER
          bash scripts/release/android.sh sign

      # The upload key from the secrets, for one step (scripts/release/android.sh
      # bundle): the bundle Google Play takes. Its alias is the default, upload.
      - name: Sign the app bundle for Google Play
        env:
          ASSET_PREFIX: ${{ needs.meta.outputs.asset_prefix }}
          VERSION: ${{ needs.meta.outputs.version }}
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KS_PASS: ${{ secrets.ANDROID_UPLOAD_KS_PASS }}
        run: |
          export JAVA_HOME="$PWD/data/toolchains/jdk"
          export JARSIGNER="$JAVA_HOME/bin/jarsigner" KEYTOOL="$JAVA_HOME/bin/keytool"
          bash scripts/release/android.sh bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-android
          path: release-assets/
          if-no-files-found: error
          retention-days: 3
      # For the Play Console, by hand: the one artifact that outlives the release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: play-bundle/
          if-no-files-found: error
          retention-days: 90

      - name: Disk (after the job)
        if: always()
        run: df -h . && du -sh data/target-android data/toolchains 2>/dev/null || true

  # The .ipa of the product for iOS, on a macOS runner, for a product whose
  # folder holds its Xcode project (meta.sh build_ios): the steps of the iOS
  # lab (.github/workflows/ios.yml) that a release needs. Without the Apple
  # secrets of this repository the app is built without a signature
  # (scripts/ios/build.sh device-unsigned) and the summary of the run says
  # so; with all of them it is signed for App Store Connect, uploaded to
  # TestFlight, and the signed .ipa is the one the release holds. A red job
  # here publishes nothing, as on every other platform. No token: this job
  # writes nothing on GitHub.
  ios:
    needs: meta
    if: needs.meta.outputs.build_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PRODUCT: ${{ needs.meta.outputs.product }}
      # The archive of libwebrtc for the phone: LiveKit's of the same commit
      # (scripts/webrtc-toolchain.sh pins its hash), as the lab takes it,
      # until Veydan-WebRTC publishes ours (services/webrtc/build/ios.sh).
      WEBRTC_SOURCE: livekit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode of the image
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # The version rust-toolchain.toml names, with the targets
      # scripts/ios/env.sh asks for: the phone, and its simulator.
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc -V

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> data/target-ios/${{ needs.meta.outputs.product }}
          key: ios-${{ needs.meta.outputs.product }}

      # The image has Xcode and CocoaPods, not XcodeGen, which the Tauri CLI
      # runs over gen/apple/project.yml. The bash of macOS is 3.2, which
      # cannot read scripts/product.sh; the one of Homebrew comes first on
      # the PATH of the image.
      - name: XcodeGen and bash
        run: brew install xcodegen bash

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # The engine of calls: its archive for the phone, fetched by
      # scripts/ios/env.sh and kept between runs by the hash of the script
      # that pins it (the key of the lab).
      - name: libwebrtc (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/toolchains/webrtc
          key: webrtc-veydan-ios-objc2-${{ hashFiles('scripts/webrtc-toolchain.sh') }}

      # The Apple secrets of this repository decide the path, and only the
      # answer leaves the step: all four, a build signed for App Store
      # Connect and its upload to TestFlight; none, a build without a
      # signature, said in the summary of the run; some of them, a mistake
      # that stops the job before it builds.
      - id: apple
        name: The Apple secrets
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_API_ISSUER: ${{ secrets.IOS_API_ISSUER }}
          IOS_API_KEY_ID: ${{ secrets.IOS_API_KEY_ID }}
          IOS_API_KEY_P8: ${{ secrets.IOS_API_KEY_P8 }}
        run: |
          set -euo pipefail
          set_count=0
          for value in "$IOS_TEAM_ID" "$IOS_API_ISSUER" "$IOS_API_KEY_ID" "$IOS_API_KEY_P8"; do
            [ -z "$value" ] || set_count=$((set_count + 1))
          done
          case "$set_count" in
            4) echo "signed=true" >> "$GITHUB_OUTPUT" ;;
            0)
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::iOS is unsigned: the Apple secrets are not set in this repository"
              {
                echo "### iOS is unsigned"
                echo
                echo "iOS is unsigned: the Apple secrets are not set in this repository (IOS_TEAM_ID, IOS_API_ISSUER, IOS_API_KEY_ID, IOS_API_KEY_P8)."
                echo "The release holds the .ipa without a signature, and nothing was uploaded to TestFlight."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::IOS_TEAM_ID, IOS_API_ISSUER, IOS_API_KEY_ID and IOS_API_KEY_P8 (base64 of the .p8) are set together or not at all; $set_count of 4 are set"
              exit 1
              ;;
          esac

      # The CLI is the one of the UI project, as on the other platforms:
      # TAURI_APP_PATH names the product, TAURI_FRONTEND_PATH the UI project.
      - name: Build without a signature (scripts/ios/build.sh)
        if: steps.apple.outputs.signed != 'true'
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/apps/${{ needs.meta.outputs.product }}
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/ui
        run: bash scripts/ios/build.sh "$PRODUCT" device-unsigned

      # The signed build: the Apple variables the Tauri CLI reads for
      # automatic signing (internal/platform-spec.md 13.6), each from its
      # secret in the env of this step alone, and the key of App Store
      # Connect as a file of the run, removed below whatever happens.
      - name: Build, signed for App Store Connect (scripts/ios/build.sh)
        if: steps.apple.outputs.signed == 'true'
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/apps/${{ needs.meta.outputs.product }}
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/ui
          EXPORT_METHOD: app-store-connect
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.IOS_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.IOS_API_KEY_ID }}
          IOS_API_KEY_P8: ${{ secrets.IOS_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$IOS_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY.p8"
          unset IOS_API_KEY_P8
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY.p8"
          # The build number (CFBundleVersion) of each upload: App Store
          # Connect takes a build number of a version once, so an rc and
          # the release of one version need numbers of their own. The run
          # number of this workflow only grows in the repository, the
          # attempt tells a re-run apart; three integers, as Apple wants
          # (Tauri's --build-number would append a fourth to X.Y.Z).
          build_number="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT.0"
          echo "iOS build number: $build_number" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/ios/build.sh "$PRODUCT" device-signed \
            --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$build_number\"}}}"

      # TestFlight: the signed .ipa to App Store Connect with the same key,
      # which altool reads from ./private_keys/AuthKey_<id>.p8; the id and
      # the issuer name the key, the .p8 is the secret and stays a file.
      # Processing and the testers are the owner's, in App Store Connect.
      - name: Upload to App Store Connect (TestFlight)
        if: steps.apple.outputs.signed == 'true'
        env:
          IOS_API_ISSUER: ${{ secrets.IOS_API_ISSUER }}
          IOS_API_KEY_ID: ${{ secrets.IOS_API_KEY_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=(release-assets/ios/*_ios-arm64.ipa)
          if [ "${#signed[@]}" -ne 1 ]; then
            echo "::error::the signed build left ${#signed[@]} files *_ios-arm64.ipa in release-assets/ios, not one"
            exit 1
          fi
          mkdir -p private_keys
          cp "$RUNNER_TEMP/private_keys/AuthKey_$IOS_API_KEY_ID.p8" private_keys/
          xcrun altool --upload-app --type ios --file "${signed[0]}" --apiKey "$IOS_API_KEY_ID" --apiIssuer "$IOS_API_ISSUER"
          rm -rf private_keys

      - name: Remove the key of App Store Connect
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys" private_keys

      # The .ipa under the prefix of the other files of the release
      # (productName of tauri.conf.json: Veydan.Space), where build.sh names
      # it after the iOS app (productName of tauri.ios.conf.json). One .ipa:
      # the signed one when it was made, the one without a signature
      # otherwise, which says so in its name.
      - name: Gather the .ipa
        env:
          ASSET_PREFIX: ${{ needs.meta.outputs.asset_prefix }}
          VERSION: ${{ needs.meta.outputs.version }}
          SIGNED: ${{ steps.apple.outputs.signed }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "$SIGNED" = "true" ]; then tail="ios-arm64.ipa"; else tail="ios-arm64-unsigned.ipa"; fi
          built=(release-assets/ios/*_"${VERSION}_${tail}")
          if [ "${#built[@]}" -ne 1 ]; then
            echo "::error::scripts/ios/build.sh left ${#built[@]} files *_${VERSION}_${tail} in release-assets/ios, not one"
            exit 1
          fi
          mkdir -p ios-assets
          cp "${built[0]}" "ios-assets/${ASSET_PREFIX}_${VERSION}_${tail}"
          ls -la ios-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-ios
          path: ios-assets/
          if-no-files-found: error
          retention-days: 3

      - name: Disk (after the job)
        if: always()
        run: df -h . && du -sh data/target-ios data/toolchains 2>/dev/null || true

  # Everything together: every signature checked against the public key of
  # the product, latest.json over every platform, SHA256SUMS, the note of
  # the version as the text — published under the tag as a pre-release (rc)
  # or THE release (the latest). Only this job may write.
  publish:
    needs: [meta, build, android, ios]
    # iOS blocks as the other platforms do; a product without an Xcode
    # project skips it. A job whose need was skipped is skipped too unless
    # its condition calls a status function: !cancelled() is that call, and
    # the results named here are the whole condition.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.android.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # scripts/release/, the note, and gh calls git even when --repo is set.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: release-assets
          merge-multiple: true

      - name: Every signature, then the release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.meta.outputs.kind == 'rc' && 'channel' || 'release' }}
          KIND: ${{ needs.meta.outputs.kind }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.meta.outputs.release_name }}
          NOTES_SOURCE: ${{ needs.meta.outputs.notes_file }}
          ASSET_PREFIX: ${{ needs.meta.outputs.asset_prefix }}
          VERSION: ${{ needs.meta.outputs.version }}
          UPDATER_KEYS: ${{ needs.meta.outputs.updater_keys }}
          UPDATER_PUBKEY: ${{ needs.meta.outputs.updater_pubkey }}
          BUILD_IOS: ${{ needs.meta.outputs.build_ios }}
          ASSETS_DIR: release-assets
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The release of this repository goes under its own tag $GITHUB_REF_NAME, not $RELEASE_TAG"
            exit 1
          fi
          node scripts/release/assets.mjs verify --dir "$ASSETS_DIR" --prefix "$ASSET_PREFIX" --version "$VERSION" \
            --keys "$UPDATER_KEYS" --pubkey "$UPDATER_PUBKEY" --ios "$BUILD_IOS"
          if [ ! -f "$NOTES_SOURCE" ]; then
            echo "::error::$NOTES_SOURCE: the release note of $VERSION is missing at the tag"
            exit 1
          fi
          NOTES_FILE="$(mktemp)"
          node scripts/release/notes.mjs body "$NOTES_SOURCE" --kind "$KIND" > "$NOTES_FILE"
          export NOTES_FILE
          ls -la "$ASSETS_DIR"
          bash scripts/release/publish.sh
