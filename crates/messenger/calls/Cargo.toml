[package]
name = "messenger-calls"
description = "Calls, the core without a media engine: the state of a call, its signalling over NIP-17, the choice of relay nodes, the MediaEngine trait an engine implements"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
messenger-core.workspace = true
messenger-store.workspace = true
messenger-dm.workspace = true
# The pinned TLS of the project's nodes (identity v2) and the h2 the
# control channel of a call node speaks; see node_client.rs.
messenger-vlink.workspace = true
nostr.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
getrandom.workspace = true
hex.workspace = true
# The keys of the frames of a group call (HKDF over SHA-256), the sealed
# word of identity on the control channel (AES-GCM, a BIP-340 signature);
# see group/keys.rs.
sha2.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
base64.workspace = true
secp256k1.workspace = true
bytes.workspace = true
h2.workspace = true
http.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net", "rt", "macros"] }

[dev-dependencies]
messenger-testkit.workspace = true
messenger-contacts.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
